<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="75" height="75">
  <!-- Yellow Rounded Box with Black Border -->
  <rect x="4" y="4" width="192" height="192" rx="30" ry="30" fill="#FFF200" stroke="#000000" stroke-width="4.5"/>
  
  <!-- Red Crescent Moon -->
  <path d="M 146,26 C 55,20 12,65 14,118 C 16,148 45,172 154,140 C 42,128 36,68 146,26 Z" fill="#EE1C25"/>
  
  <!-- 3D Shadow for HSI Text (Red Offset) -->
  <text x="73" y="118" font-family="'Arial Black', 'Trebuchet MS', Impact, sans-serif" font-size="62" font-weight="900" fill="#EE1C25">HSI</text>
  
  <!-- Main HSI Text (Royal Blue) -->
  <text x="68" y="115" font-family="'Arial Black', 'Trebuchet MS', Impact, sans-serif" font-size="62" font-weight="900" fill="#002BB8">HSI</text>
  
  <!-- Computer Graphic under the I -->
  <g transform="translate(142, 128) scale(0.7)">
    <rect x="6" y="23" width="22" height="4" fill="#EE1C25"/>
    <rect x="14" y="17" width="6" height="7" fill="#EE1C25"/>
    <rect x="2" y="2" width="30" height="17" rx="2" fill="#EE1C25"/>
    <rect x="5" y="4" width="24" height="11" fill="#002BB8"/>
    <ellipse cx="-4" cy="22" rx="4.5" ry="2.5" fill="#002BB8"/>
    <path d="M 0 22 Q 4 22 7 18" stroke="#EE1C25" stroke-width="1.8" fill="none"/>
  </g>

  <!-- Bottom Text: HOSPITAL SULTAN ISMAIL / JOHOR BAHRU -->
  <text x="100" y="165" font-family="'Arial Black', Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#002BB8" text-anchor="middle">HOSPITAL SULTAN ISMAIL</text>
  <text x="100" y="181" font-family="'Arial Black', Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#002BB8" text-anchor="middle">JOHOR BAHRU</text>
</svg>
